name: GraphQL Inspector
 
on: [push]
 
jobs:
  test:
    name: Check Schema
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@master
 
      - uses: kamilkisiela/graphql-inspector@master
        with:
          schema: '${{ github.ref_name }}:gql-specificatie/Leveringsregister.graphql'
          rules: suppressRemovalOfDeprecatedField
          fail-on-breaking: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate queries (fail on deprecated usage)
        run: |
          npx graphql-inspector@master validate \
            "./gql-query/**/*.graphql" \
            "./gql-specificatie/Leveringsregister.graphql" \
            --rules suppressRemovalOfDeprecatedField