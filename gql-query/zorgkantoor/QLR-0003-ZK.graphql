# QLR-0003-ZK.graphql
# Query voor zorgkantoor op Leveringsregister
# Verplichte input:
#   - bemiddelingspecificatieID

#Query
query Levering(
    $BemiddelingspecificatieID: UUID!
){
    Levering(
        Where: {
            bemiddelingspecificatieID: {eq: $bemiddelingspecificatieID}
        }
    ) {
        leveringID
        bemiddelingspecificatieID
        client{
            clientID
            bsn
        }
        leveringperiodes{
         leveringperiodeID
        ingangsdatum
        vaststellingMoment
        sleuteldatum
        einddatum
        beeindigingReden
        aanbiederBestemming
        behandelingperiodes{
          behandelingperiodeID
          ingangsdatum
          einddatum
        }
      }
      uitstelperiodes{
        uitstelperiodeID
        ingangsdatum
        vaststellingMoment
        reden
        leveringsstatus
        leveringsstatusClassificatie
        einddatum
       }
       afstel{
        afstelID
        afsteldatum
        vaststellingMoment
        reden
        aanbiederBestemming
        }   
        }
    }
