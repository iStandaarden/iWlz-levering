# QLR-0001-ZA.graphql
# Query voor aanbieders op Leveringsregister
# Verplichte input:
#    - bemiddelingspecificatieID

#Query
query Levering(
    $BemiddelingspecificatieID: UUID!
) {
    Levering(
        where: {
            bemiddelingspecificatieID: { eq: $BemiddelingspecificatieID}
        }
    ) {
      leveringID
      bemiddelingspecificatieID
      client{
        clientID
        bsn
      }
      leveringperiodes{
        leveringperiodeID
        ingangsdatum
        vaststellingMoment
        sleuteldatum
        einddatum
        beeindigingReden
        aanbiederBestemming
        behandelingperiodes{
          behandelingperiodeID
          ingangsdatum
          einddatum
        }
      }
      uitstelperiodes{
        uitstelperiodeID
        ingangsdatum
        vaststellingMoment
        reden
        leveringsstatus
        leveringsstatusClassificatie
        einddatum
       }
       afstel{
        afstelID
        afsteldatum
        vaststellingMoment
        reden
        aanbiederBestemming
        }
      }
  }
  


